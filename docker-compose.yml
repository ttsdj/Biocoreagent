services:
  memory-postgres:
    # pgvector image so the store can run the optional dense ANN upgrade
    # (initialize() enables the `vector` extension + column + HNSW).  A stock
    # postgres image still works: the store auto-detects the missing extension
    # and keeps the JSONB cosine fallback.
    image: pgvector/pgvector:pg15
    profiles: ["memory"]
    environment:
      POSTGRES_DB: scicore_bio_memory
      POSTGRES_USER: scicore.bio
      # Development-only default. Production must supply an external secret.
      POSTGRES_PASSWORD: scicore_bio_dev_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - scicore.bio-memory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scicore.bio -d scicore_bio_memory"]
      interval: 3s
      timeout: 3s
      retries: 20

  scicore:
    build: .
    image: scicore:local
    volumes:
      - ./:/app
      - ./workspace:/workspace
    working_dir: /workspace
    command: ["--help"]

volumes:
  scicore.bio-memory-postgres:
