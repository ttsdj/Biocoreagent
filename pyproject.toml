[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scicore-agent"
version = "2.0.0a2"
authors = [{ name = "ttsdj", email = "chengzhideng1@gmail.com" }]
description = "Auditable research-oriented coding agent harness with bioinformatics workflow routing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "openai>=1.0",
  "openpyxl>=3.1",
  "pydantic>=2.0",
  "python-docx>=1.0",
]

[project.optional-dependencies]
bio = ["biopython>=1.83"]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]
memory-postgres = ["psycopg[binary]>=3.1", "sentence-transformers>=3.0"]

[project.scripts]
scicore = "scicore.bio.cli:main"
scicore-mcp = "scicore.agent.mcp_server:main"
scicore-doctor = "scicore.agent.bio_cli:main"
scicore-bixbench = "scicore.agent.eval.bixbench:main"
scicore-replay = "scicore.bio.replay_cli:main"

[tool.setuptools.packages.find]
include = ["scicore*"]

[tool.setuptools.package-data]
"scicore.agent.bio" = ["skills/*.md"]
"scicore.agent.eval" = ["bixbench_smoke.json", "bixbench_fixtures/rnaseq_small/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 运行耗时较长（如确定性回放全套 100 条）的测试，默认不参与 CI 全量。",
    "postgres: 需要 Postgres 长期记忆服务的可选集成测试，无 DSN 时按条件跳过。",
]
